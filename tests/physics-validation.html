<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worldline — physics oracles</title>
<meta name="robots" content="noindex, nofollow">
<!-- Resolve the production modules and shader fetches exactly as /worldline/ does. -->

<script src="/shared/tokens.js"></script>
<script src="colors.js"></script>
<style>

         background: var(--bg-canvas, #fcfcfb); color: var(--text, #161514); }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; vertical-align: top; border-bottom: 1px solid #0002; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }

</style>

<body>
<h1>Physics oracles</h1>
<p>Analytic oracles against the production <code>GPUPhysics</code>, headless, on this browser's
WebGPU device. Press Run, or call <code>await window.__run(filter)</code>, which resolves to
<code>{ passed, failed, skipped, results }</code>; <code>tests/gpu.test.mjs</code> drives it.</p>
<p><button id="runBtn">Run</button> <span id="status">Idle.</span></p>
<table>
  <thead><tr><th>Status</th><th>Case</th><th>Expected</th><th>Measured</th><th>Metric</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="log"></pre>

<script type="module">
import GPUPhysics from './src/gpu/gpu-physics.js';
import { PION_SIZE, PARTICLE_STATE_SIZE } from './src/gpu/gpu-buffers.js';
import {
    PION_HALF_LIFE, BOSON_CHARGE, SHEET_THICKNESS, SHEET_THICKNESS_SQ, SOFTENING_SQ, BOUND_LOOP, TORUS,
    GPU_SCALAR_GRID, PHYSICS_DT, WORLDLINE_LEN, INERTIA_K, COL_MERGE,
    GPU_MAX_PHOTONS, PHOTON_CULL_AGE,
} from './src/config.js';
import { WL_STRIDE } from './src/gpu/gpu-constants.js';
import { TOGGLE_KEYS, GPU_PARAMETER_SLOTS } from './src/physics-contract.js';
import { curveAt } from './src/prescribed.js';

const rowsEl = document.getElementById('rows');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const fmt = (v, d = 4) => (typeof v === 'number' && isFinite(v)) ? v.toPrecision(d) : String(v);
const logln = (text) => { logEl.textContent += text + '\n'; };

// ── Harness ──

let _device = null, _gp = null, _gpuErrors = [];
async function getDevice() {
    if (_device) return _device;
    const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
    if (!adapter) return null;
    _device = await adapter.requestDevice({
        requiredLimits: {
            maxStorageBufferBindingSize: 256 * 1024 * 1024,
            maxBufferSize: 256 * 1024 * 1024,
            maxComputeWorkgroupsPerDimension: 65535,
            maxStorageBuffersPerShaderStage: Math.min(adapter.limits.maxStorageBuffersPerShaderStage, 10),
            maxBindingsPerBindGroup: adapter.limits.maxBindingsPerBindGroup,
        },
    });
    // A WGSL compile or validation error doesn't throw: it lands here, and fails the case it hit
    _device.addEventListener('uncapturederror', (e) => _gpuErrors.push(e.error.message));
    return _device;
}

/** A physics store: every toggle off, the parameters the cases assume, overrides on top. */
function physicsWith(on = [], params = {}) {
    const p = {
        yukawaMu: 0.15, higgsMass: 0.5, axionMass: 0.05, hubbleParam: 0.001, cosmoSchedule: 0, fieldDamping: 1,
        extGravity: 0, extGravityAngle: 0, extElectric: 0, extElectricAngle: 0, extBz: 0,
        bounceFriction: 0.4, collisionMode: 0, yukawaCoupling: 14,
    };
    for (const k of TOGGLE_KEYS) p[k] = false;
    for (const k of on) p[k] = true;
    return Object.assign(p, params);
}

/**
 * The headless GPUPhysics, configured for one case. There is one, cleared by reset() (the
 * Clear button's path) between cases: init() compiles every pipeline, which takes most of a
 * minute on a software adapter. `tree` pins the force summation ('pairwise' | 'tree'; null
 * leaves it to the automatic rule) and `theta` the opening angle.
 */
async function makeSim({ on = [], params = {}, domainW = 64, domainH = 48, boundary = 0, tree = null, theta = null } = {}) {
    if (!_gp) {
        _gp = new GPUPhysics(await getDevice(), domainW, domainH);
        await _gp.init();
        await _gp._ensurePhase5Pipelines();
    }
    const gp = _gp;
    gp.reset();
    gp._maxAccel = 0;                       // the first substep count reads the last frame's
    gp.boundaryMode = boundary;
    gp.topologyMode = TORUS;
    gp.treeOverride = tree;
    gp.thetaOverride = theta;
    gp.setComovingDomain(domainW, domainH);
    gp.setToggles(physicsWith());           // so switching expansion on starts the schedule afresh
    gp.setToggles(physicsWith(on, params));
    return gp;
}

async function readBuffer(gp, buf, bytes) {
    const staging = gp.device.createBuffer({ size: bytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const enc = gp.device.createCommandEncoder();
    enc.copyBufferToBuffer(buf, 0, staging, 0, bytes);
    gp.device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = staging.getMappedRange().slice(0);
    staging.unmap();
    staging.destroy();
    return out;
}

async function readParticles(gp) {
    const raw = await readBuffer(gp, gp.buffers.particleState, gp.aliveCount * PARTICLE_STATE_SIZE);
    const f = new Float32Array(raw), u = new Uint32Array(raw);
    return Array.from({ length: gp.aliveCount }, (_, i) => {
        const b = i * 9;
        return { x: f[b], y: f[b + 1], wx: f[b + 2], wy: f[b + 3], mass: f[b + 4], charge: f[b + 5], alive: (u[b + 8] & 1) !== 0 };
    });
}

/** Clocks of the first n slots: [{tau, phase, theta, lapse}]. */
async function readClocks(gp, n) {
    const f = new Float32Array(await readBuffer(gp, gp.buffers.clocks, n * 16));
    return Array.from({ length: n }, (_, i) => ({ tau: f[i * 4], phase: f[i * 4 + 1], theta: f[i * 4 + 2], lapse: f[i * 4 + 3] }));
}

/** Slot 1's force from the last force pass (allForces f0.zw is Coulomb). */
async function coulombOnSlot1(gp) {
    const af = new Float32Array(await readBuffer(gp, gp.buffers.allForces, 2 * 160));
    return [af[42], af[43]];
}

/** Request a stats readback and wait for it (the ledger and the Friedmann density ride on it). */
async function statsNow(gp) {
    while (gp._statsPending) await new Promise(r => setTimeout(r, 2));
    gp.requestStats(-1);
    while (gp._statsPending) await new Promise(r => setTimeout(r, 2));
    return gp.readStats();
}

/** Photons straight into the pool: [{x, y, vx, vy, energy, lifetime?, alive?}]. */
function addPhotons(gp, list) {
    const buf = new ArrayBuffer(list.length * 32);
    const f = new Float32Array(buf), u = new Uint32Array(buf);
    list.forEach((p, i) => {
        const b = i * 8;
        f[b] = p.x; f[b + 1] = p.y; f[b + 2] = p.vx ?? 1; f[b + 3] = p.vy ?? 0; f[b + 4] = p.energy;
        u[b + 5] = 0xFFFFFFFF; f[b + 6] = p.lifetime ?? 1; u[b + 7] = (p.alive ?? true) ? 1 : 0;
    });
    gp.device.queue.writeBuffer(gp.buffers.photonPool, 0, buf);
    gp.device.queue.writeBuffer(gp.buffers.phCount, 0, new Uint32Array([list.length]));
}

/** Pions straight into the pool: [{x, y, wx, wy, mass, charge, kind}] (kind 1: a lepton). */
function addPions(gp, list) {
    const buf = new ArrayBuffer(list.length * PION_SIZE);
    const f = new Float32Array(buf), u = new Uint32Array(buf);
    list.forEach((p, i) => {
        const b = i * 12;
        f[b] = p.x; f[b + 1] = p.y; f[b + 2] = p.wx; f[b + 3] = p.wy;
        f[b + 4] = p.mass; f[b + 5] = p.charge; f[b + 6] = 0;
        u[b + 7] = 0xFFFFFFFF; u[b + 8] = 100; u[b + 9] = 1; u[b + 10] = p.kind ?? 0; u[b + 11] = 0;
    });
    gp.device.queue.writeBuffer(gp.buffers.pionPool, 0, buf);
    gp.device.queue.writeBuffer(gp.buffers.piCount, 0, new Uint32Array([list.length]));
}

/** Slot idx's world-line ring, oldest first: [{t, x, y, wx, wy, ax, ay, tau}] on the world-line clock. */
async function readRing(gp, idx) {
    const meta = new Uint32Array(await readBuffer(gp, gp.buffers.wlMeta, (idx + 1) * 32));
    const writeIdx = meta[idx * 8], count = meta[idx * 8 + 1];
    const f = new Float32Array(await readBuffer(gp, gp.buffers.wlData, (idx + 1) * WORLDLINE_LEN * WL_STRIDE * 4));
    return Array.from({ length: count }, (_, k) => {
        const b = (idx * WORLDLINE_LEN + ((writeIdx - count + k + WORLDLINE_LEN) % WORLDLINE_LEN)) * WL_STRIDE;
        return { t: f[b] + gp.timeEpoch, x: f[b + 1], y: f[b + 2], wx: f[b + 3], wy: f[b + 4], ax: f[b + 5], ay: f[b + 6], tau: f[b + 7] };
    });
}

/** The view buffers a frame's slice wrote: the first n slots as the observer has them. */
async function readView(gp, n) {
    const fb = gp.frameBuffers;
    const st = new Float32Array(await readBuffer(gp, fb.viewState, n * PARTICLE_STATE_SIZE));
    const st32 = new Uint32Array(st.buffer);
    const dv = new Float32Array(await readBuffer(gp, fb.viewDerived, n * 32));
    const ck = new Float32Array(await readBuffer(gp, fb.viewClocks, n * 16));
    return Array.from({ length: n }, (_, i) => ({
        x: st[i * 9], y: st[i * 9 + 1], valid: (st32[i * 9 + 8] & 1) !== 0, vx: dv[i * 8 + 4], vy: dv[i * 8 + 5], tau: ck[i * 4],
    }));
}

async function readFrameState(gp) {
    const f = new Float32Array(await readBuffer(gp, gp.frameBuffers.frameState, 80));
    return { ux: f[0], uy: f[1], gamma: f[2], tA: f[3], xA: [f[4], f[5]], lag: f[9], valid: f[11] > 0.5 };
}

function frameParams(o) {
    return Object.assign({
        kind: 3, slot: 0, lorentz: true, images: 1, boostX: 0, boostY: 0, originX: 0, originY: 0,
        refT: 0, lookBack: 0, viewX: 0, viewY: 0, viewHalfW: 40, viewHalfH: 40, omega: 0,
    }, o);
}

/** Relativistic circular-orbit speed under the softened central force k·r/(r²+ε²)^{3/2} on mass m. */
function vCircRel(k, r, m) {
    const rSq = r * r + SOFTENING_SQ;
    const s = Math.abs(k) * r * r / (m * rSq * Math.sqrt(rSq));
    return Math.sqrt((-s * s + Math.sqrt(s ** 4 + 4 * s * s)) / 2);
}

/** Advance lab time T in frames of dt. */
async function run(gp, T, dt) {
    const frames = Math.round(T / dt);
    for (let i = 0; i < frames; i++) {
        gp.update(dt);
        if ((i & 63) === 63) await gp.device.queue.onSubmittedWorkDone();
    }
    await gp.device.queue.onSubmittedWorkDone();
}

/** A seeded uniform generator on [0, 1). */
const lcg = (s) => () => (s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296;

// ── Cases ──
// Each case is one mechanism, checked against an independent prediction. Each returns
// { expected, measured, metric, pass }.

const cases = [];

// ── Clocks and spin ──

// On a circular orbit dτ/dt = √(1 − 3M/r) (Schwarzschild, exact): the lapse's potential and
// velocity terms together. With Newtonian gravity and r ≫ ε it agrees to O(M²/r²).
cases.push({
    name: 'Proper time: a circular-orbit clock runs at √(1 − 3M/r)',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'relativityEnabled'], domainW: 1024, domainH: 1024 });
        const M = 10, r = 400, v = vCircRel(M, r, 1);
        gp.addParticle({ x: 512, y: 512, mass: M, bornAt: -Infinity });
        gp.addParticle({ x: 512 + r, y: 512, vy: v / Math.sqrt(1 - v * v), mass: 1e-4, bornAt: -Infinity });
        await run(gp, 50, 0.5);
        const [, clock] = await readClocks(gp, 2);
        const expected = Math.sqrt(1 - 3 * M / r), rate = clock.tau / 50;
        return { expected: fmt(expected, 5), measured: fmt(rate, 5),
                 metric: `${fmt((rate / expected - 1) * 100, 3)}%`, pass: Math.abs(rate / expected - 1) < 1e-3 };
    },
});

// Thomas precession: a non-spinning charge on a circular Coulomb orbit turns its spoke by
// −2π(γ − 1) per orbit. Gravity plays no part.
cases.push({
    name: 'Thomas precession: −2π(γ − 1) per Coulomb orbit',
    async run() {
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: 128, domainH: 128 });
        const r = 16, Q = 12, q = -2, v = vCircRel(Q * Math.abs(q), r, 1), gamma = 1 / Math.sqrt(1 - v * v);
        gp.addParticle({ x: 64, y: 64, mass: 1e5, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: 64 + r, y: 64, vy: gamma * v, mass: 1, charge: q, bornAt: -Infinity });
        // One lab-time orbit, the spoke angle unwrapped
        const dt = 0.2, frames = Math.round(2 * Math.PI * r / v / dt), every = Math.floor(frames / 40);
        let theta = (await readClocks(gp, 2))[1].theta, turned = 0;
        for (let i = 0; i < frames; i++) {
            gp.update(dt);
            if ((i + 1) % every && i !== frames - 1) continue;
            const next = (await readClocks(gp, 2))[1].theta;
            let d = next - theta;
            d -= 2 * Math.PI * Math.round(d / (2 * Math.PI));
            turned += d;
            theta = next;
        }
        const expected = -2 * Math.PI * (gamma - 1);
        return { expected: `${fmt(expected * 180 / Math.PI)}° (v = ${fmt(v, 3)})`, measured: `${fmt(turned * 180 / Math.PI)}°`,
                 metric: `${fmt((turned / expected - 1) * 100, 2)}%`, pass: Math.abs(turned / expected - 1) < 0.03 };
    },
});

// ── Force laws ──

// Co-moving like charges (Relativity off): the magnetic force q v × B of the partner's
// Biot–Savart field takes w² of the electric repulsion away. A reversed sign adds it.
cases.push({
    name: 'Magnetism: co-moving like charges lose w² of their repulsion (Biot–Savart sign)',
    async run() {
        const w = 0.75;
        const lateral = async (mag) => {
            const gp = await makeSim({ on: ['coulombEnabled', ...(mag ? ['magneticEnabled'] : [])], domainW: 256, domainH: 256 });
            gp.addParticle({ x: 100, y: 128, vx: w, mass: 1000, charge: 2 });
            gp.addParticle({ x: 100, y: 138, vx: w, mass: 1000, charge: 2 });
            await run(gp, 1, 0.05);
            return (await readParticles(gp))[1].wy;
        };
        const ratio = await lateral(true) / await lateral(false), expected = 1 - w * w;
        return { expected: fmt(expected, 4), measured: fmt(ratio, 4),
                 metric: `${fmt((ratio / expected - 1) * 100, 2)}%`, pass: Math.abs(ratio / expected - 1) < 1e-3 };
    },
});

// Gravitomagnetic clock effect (Relativity off): about a spinning mass, prograde circular
// orbits run slow and retrograde fast, T₊ − T₋ = 4πJ/M at first order in J (Cohen and
// Mashhoon 1993). With s = (r² + ε²)^{-3/2} a circular orbit has Ω² ± 2JsΩ − Ms = 0.
cases.push({
    name: 'Gravitomagnetism: prograde minus retrograde period about a spinning mass is 4πJ/M',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'gravitomagEnabled'], domainW: 256, domainH: 256 });
        const M = 10, r = 40, R = Math.cbrt(M), omega = 0.5 / R;
        const J = INERTIA_K * M * omega * R * R, s3 = Math.pow(r * r + SOFTENING_SQ, -1.5);
        const Om = (sign) => -sign * J * s3 + Math.sqrt(J * J * s3 * s3 + M * s3);
        gp.addParticle({ x: 128, y: 128, mass: M, angw: omega });
        gp.addParticle({ x: 128 + r, y: 128, vy: Om(1) * r, mass: 1e-3 });    // prograde
        gp.addParticle({ x: 128 - r, y: 128, vy: Om(-1) * r, mass: 1e-3 });   // retrograde
        const T = [2 * Math.PI / Om(1), 2 * Math.PI / Om(-1)];
        const angle = (p, c) => Math.atan2(p.y - c.y, p.x - c.x);
        let ps = await readParticles(gp);
        const last = [angle(ps[1], ps[0]), angle(ps[2], ps[0])], swept = [0, 0], period = [0, 0];
        const dt = 1;
        for (let t = dt; (!period[0] || !period[1]) && t < 1.2 * Math.max(...T); t += dt) {
            gp.update(dt);
            ps = await readParticles(gp);
            for (let k = 0; k < 2; k++) {
                const a = angle(ps[k + 1], ps[0]);
                let d = a - last[k];
                d -= 2 * Math.PI * Math.round(d / (2 * Math.PI));
                const before = swept[k];
                swept[k] += Math.abs(d);
                last[k] = a;
                if (!period[k] && swept[k] >= 2 * Math.PI) period[k] = t - dt + dt * (2 * Math.PI - before) / (swept[k] - before);
            }
        }
        const expected = T[0] - T[1], measured = period[0] - period[1];
        return { expected: `${fmt(expected, 4)} (4πJ/M = ${fmt(4 * Math.PI * J / M, 4)})`, measured: fmt(measured, 4),
                 metric: `${fmt((measured / expected - 1) * 100, 2)}%`, pass: Math.abs(measured / expected - 1) < 0.03 };
    },
});

// The stats' energy against the dynamics: an equal-mass pair on an eccentric orbit under
// Newton, the 4m v × Bg rotation and the 1PN remainder (harmonic-gauge EIH). Along the orbit
// T + V swings by the 1PN terms; the stats' total, which books EIH's conserved energy, keeps
// only the truncation error, O(M/r) of that swing.
cases.push({
    name: '1PN: the booked EIH energy holds on an eccentric binary while T + V swings',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'gravitomagEnabled', 'onePNEnabled'], domainW: 4096, domainH: 4096 });
        const d = 100, C = 2048, T = 4000, n = 40;
        const vrel = 0.85 * Math.sqrt(2 * d * d / Math.pow(d * d + SOFTENING_SQ, 1.5));   // μ = ½, k = 1
        gp.addParticle({ x: C - d / 2, y: C, vy: -vrel / 2, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: C + d / 2, y: C, vy: vrel / 2, mass: 1, bornAt: -Infinity });
        gp.update(0.01);
        const E = [], EN = [];
        for (let i = 0; i <= n; i++) {
            const s = await statsNow(gp), [a, b] = await readParticles(gp);
            const rs = Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + SOFTENING_SQ);
            E.push(s.linearKE + s.pe + s.fieldEnergy);
            EN.push(0.5 * (a.wx ** 2 + a.wy ** 2 + b.wx ** 2 + b.wy ** 2) - 1 / rs);
            if (i < n) await run(gp, T / n, 4);
        }
        const span = (xs) => Math.max(...xs) - Math.min(...xs), ratio = span(E) / span(EN);
        return { expected: 'stats swing ≪ T + V swing', measured: `stats ${fmt(span(E), 3)}, T + V ${fmt(span(EN), 3)}`,
                 metric: `ratio ${fmt(ratio, 3)}`, pass: ratio < 0.2 };
    },
});

// ── Signal delay ──

/** The Liénard–Wiechert force on charge q at rest b from the line of a charge Q moving at v along x, at time te. */
function uniformLW(xs, obsX, b, v, Q, q, te) {
    let tr = te;
    for (let k = 0; k < 60; k++) tr = te - Math.hypot(obsX - xs(tr), b);
    const Rp = [obsX - xs(te), b], Rlen = Math.hypot(...Rp), sin2 = (b / Rlen) ** 2;
    const Rret = te - tr, sigma = Rret / Math.sqrt(Rret * Rret + SOFTENING_SQ);
    const k = q * Q * (1 - v * v) / (Rlen ** 3 * Math.pow(1 - v * v * sin2, 1.5)) * sigma ** 3;
    return [k * Rp[0], k * Rp[1]];
}

// A charge in uniform motion pulls along the line from its present position,
// E = q(1 − v²)R̂/(R²(1 − v² sin²ψ)^{3/2}) (Jackson §11.10), times σ³ of the retarded distance;
// the force pass ran at the start of the last substep. Here after the source has wrapped a
// torus several times and the GPU epoch has rebased: the world line stays continuous on the
// covering plane, and the observer sees the image nearest it now.
cases.push({
    name: 'Liénard–Wiechert: a uniformly moving charge acts from its present position, across torus wraps and epoch rebases',
    async run() {
        const W = 128, v = 0.6, g = 1 / Math.sqrt(1 - v * v), Q = 10, q = 0.1, b = 20, dt = 1, T = 700;
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: W, domainH: W, boundary: BOUND_LOOP });
        gp.addParticle({ x: 10, y: 64, vx: g * v, mass: 1e6, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: 100, y: 64 + b, mass: 1e6, charge: q, bornAt: -Infinity });
        await run(gp, T, dt);
        const F = await coulombOnSlot1(gp), epoch = gp.timeEpoch, te = T - dt;
        const shift = -W * Math.round((100 - (10 + v * te)) / W);   // the image nearest now, followed back
        const want = uniformLW((t) => 10 + v * t - shift, 100, b, v, Q, q, te);
        const err = Math.hypot(F[0] - want[0], F[1] - want[1]) / Math.hypot(...want);
        return { expected: `(${fmt(want[0], 4)}, ${fmt(want[1], 4)}), ${Math.floor((10 + v * te) / W)} wraps`,
                 measured: `(${fmt(F[0], 4)}, ${fmt(F[1], 4)}), epoch ${epoch}`,
                 metric: `${fmt(err * 100, 2)}%`, pass: err < 2e-3 && epoch > 0 };
    },
});

/** The softened Liénard–Wiechert force on a charge q at rest at obs, time T, from charge Q on curve c. */
function lwForceFromCurve(c, Q, q, obs, T) {
    let tr = T;
    for (let k = 0; k < 60; k++) { const p = curveAt(c, tr); tr = T - Math.hypot(obs[0] - p.x, obs[1] - p.y); }
    const p = curveAt(c, tr), g = Math.sqrt(1 + p.wx * p.wx + p.wy * p.wy);
    const beta = [p.wx / g, p.wy / g], ba = beta[0] * p.ax + beta[1] * p.ay;
    const bdot = [(p.ax - beta[0] * ba) / g, (p.ay - beta[1] * ba) / g];
    const Rv = [obs[0] - p.x, obs[1] - p.y], R = Math.hypot(...Rv), n = [Rv[0] / R, Rv[1] / R];
    const k3 = (1 - (n[0] * beta[0] + n[1] * beta[1])) ** 3, nb = [n[0] - beta[0], n[1] - beta[1]];
    const b2 = beta[0] ** 2 + beta[1] ** 2, nbd = n[0] * bdot[0] + n[1] * bdot[1], nnb = n[0] * nb[0] + n[1] * nb[1];
    const s3 = (R / Math.sqrt(R * R + SOFTENING_SQ)) ** 3;
    // n̂ × ((n̂ − β) × β̇) = (n̂ − β)(n̂·β̇) − β̇(n̂·(n̂ − β))
    return [0, 1].map((i) => q * Q * s3 * (nb[i] * (1 - b2) / (k3 * R * R) + (nb[i] * nbd - bdot[i] * nnb) / (k3 * R)));
}

// Radiation: a prescribed oscillating charge, its past written at once, acts with the full
// Liénard–Wiechert field of its curve, the 1/R acceleration term included.
cases.push({
    name: 'Radiation field: an oscillating charge acts with the Liénard–Wiechert field of its past',
    async run() {
        const gp = await makeSim({ on: ['coulombEnabled', 'relativityEnabled'], domainW: 512, domainH: 512 });
        const c = { kind: 'oscillation', t0: 0, cx: 256, cy: 256, nx: 1, ny: 0, amp: 4, omega: 0.15, phase: 0 };
        const Q = 10, q = 0.1, obs = [256, 296];
        gp.addPrescribed(c, { mass: 1, charge: Q, bornAt: -Infinity });
        gp.addParticle({ x: obs[0], y: obs[1], mass: 1e6, charge: q, bornAt: -Infinity });
        const rows = [];
        for (const T of [3, 17, 31]) {
            await run(gp, T - gp.simTime, 0.25);
            const F = await coulombOnSlot1(gp), want = lwForceFromCurve(c, Q, q, obs, gp.simTime - 0.25);
            rows.push({ F, want, err: Math.hypot(F[0] - want[0], F[1] - want[1]) / Math.hypot(...want) });
        }
        const err = Math.max(...rows.map((r) => r.err));
        return { expected: rows.map((r) => `(${fmt(r.want[0], 3)}, ${fmt(r.want[1], 3)})`).join(' '),
                 measured: rows.map((r) => `(${fmt(r.F[0], 3)}, ${fmt(r.F[1], 3)})`).join(' '),
                 metric: `${fmt(err * 100, 2)}%`, pass: err < 5e-3 };
    },
});

// ── Trees ──

// Barnes–Hut against the pairwise sum on a torus: within θ's error, every body in the tree
// exactly once (the root counts every slot, ghosts included), and the same bits on a rerun.
cases.push({
    name: 'Barnes–Hut: 600 bodies within θ’s error of pairwise, every body once, the same bits twice',
    async run() {
        const N = 600, W = 96;
        const step = async (bh) => {
            const gp = await makeSim({ on: ['gravityEnabled'], tree: bh ? 'tree' : 'pairwise', theta: 0.5,
                                       domainW: W, domainH: W, boundary: BOUND_LOOP });
            const r = lcg(0x9E3779B9);
            for (let i = 0; i < N; i++) gp.addParticle({ x: r() * W, y: r() * W, mass: 0.5 + r() });
            gp.update(0.01);
            const ps = await readParticles(gp);
            const count = new Uint32Array(await readBuffer(gp, gp.buffers.qtNodeBuffer, 80))[17];
            const slots = gp.aliveCount + new Uint32Array(await readBuffer(gp, gp.buffers.ghostCounter, 4))[0];
            return { w: ps.map(p => [p.wx, p.wy]), count, slots };
        };
        const pair = await step(false), a = await step(true), b = await step(true);
        let num = 0, den = 0, same = true;
        for (let i = 0; i < N; i++) {
            num += (a.w[i][0] - pair.w[i][0]) ** 2 + (a.w[i][1] - pair.w[i][1]) ** 2;
            den += pair.w[i][0] ** 2 + pair.w[i][1] ** 2;
            if (a.w[i][0] !== b.w[i][0] || a.w[i][1] !== b.w[i][1]) same = false;
        }
        const rms = Math.sqrt(num / den);
        return { expected: 'rms < 4%, every slot in the tree, identical reruns',
                 measured: `root ${a.count} of ${a.slots}${same ? '' : ', reruns differ'}`,
                 metric: `rms ${fmt(rms * 100, 3)}%`, pass: rms < 0.04 && a.count === a.slots && same };
    },
});

// Collision detection through the tree finds every overlapping pair once, on a torus with
// giants among the bodies, against a direct count by minimum image. The tree is from before the
// substep's drift, so a pair that overlaps only after it must still merge.
cases.push({
    name: 'Collisions: every overlapping pair found once (700 bodies with giants, on a torus)',
    async run() {
        const W = 96, r = lcg(0xC0FFEE), bodies = [];
        const gp = await makeSim({ params: { collisionMode: COL_MERGE }, domainW: W, domainH: W, boundary: BOUND_LOOP });
        for (let i = 0; i < 700; i++) {
            const m = i % 100 === 0 ? 300 + 700 * r() : 0.2 + 2 * r();
            bodies.push({ x: r() * W, y: r() * W, r: Math.cbrt(m) });
            gp.addParticle({ x: bodies[i].x, y: bodies[i].y, mass: m });
        }
        let want = 0;
        for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
            let dx = Math.abs(bodies[i].x - bodies[j].x), dy = Math.abs(bodies[i].y - bodies[j].y);
            dx = Math.min(dx, W - dx); dy = Math.min(dy, W - dy);
            if (dx * dx + dy * dy < (bodies[i].r + bodies[j].r) ** 2) want++;
        }
        gp.update(1 / 1024);
        const got = new Uint32Array(await readBuffer(gp, gp.buffers.collisionPairCounter, 4))[0];
        const pair = await makeSim({ params: { collisionMode: COL_MERGE }, domainW: 64, domainH: 64, boundary: 1 });
        pair.addParticle({ x: 30, y: 32, vx: 0.1, mass: 1 });
        pair.addParticle({ x: 32.015, y: 32, vx: -0.1, mass: 1 });
        pair.update(0.1);
        const alive = (await readParticles(pair)).filter(p => p.alive && p.mass > 0).length;
        return { expected: `${want} pairs; the closing pair merges`, measured: `${got} pairs; ${alive} left of the closing pair`,
                 metric: `${got - want}`, pass: got === want && alive === 1 };
    },
});

// ── Bosons ──

// π⁰ beam at γ = 5: survival exp(−ln2·t/(γT½)) in lab time.
cases.push({
    name: 'Pion decay runs on proper time: a γ = 5 beam halves in γT½',
    async run() {
        const gp = await makeSim({ on: ['yukawaEnabled'] });
        gp.addParticle({ x: 63, y: 47, mass: 0.001 });   // the step needs a body; far from the beam
        const n = 1024, gamma = 5, w = Math.sqrt(gamma * gamma - 1), tHalf = gamma * PION_HALF_LIFE;
        addPions(gp, Array.from({ length: n }, (_, i) => ({ x: 4, y: 4 + (i % 32), wx: w, wy: 0, mass: 0.15, charge: 0 })));

// Absorption across a torus seam: a body on the corner takes a fan of photons and charged
// pions from both sides, half crossing a seam on the way. Energy, momentum and charge are
// conserved through the ledger, and the tree's walk agrees with the pairwise search.
cases.push({
    name: 'Absorption on a torus seam: every boson taken, E, p and q conserved, tree = pairwise',
    async run() {
        const W = 64, cx = 0.4, cy = 0.5, m = 8;   // radius ∛8 = 2, straddling both seams
        const wrap = v => ((v % W) + W) % W;
        const photons = [], pions = [];
        for (let s = 0; s < 2; s++) {
            for (let k = 0; k < 12; k++) {
                const th = (s ? Math.PI : 0) + (k / 11 - 0.5) * (2 * Math.PI / 3), dx = Math.cos(th), dy = Math.sin(th);
                photons.push({ x: wrap(cx - 6 * dx), y: wrap(cy - 6 * dy), vx: dx, vy: dy, energy: s ? 0.04 : 0.07 });
            }
            for (let k = 0; k < 2; k++) {
                const th = (s ? Math.PI : 0) + (k ? 0.35 : -0.35), dx = Math.cos(th), dy = Math.sin(th);
                pions.push({ x: wrap(cx - 3.5 * dx), y: wrap(cy - 3.5 * dy), wx: 2 * dx, wy: 2 * dy,
                             mass: 0.1, charge: (s && k) ? -BOSON_CHARGE : BOSON_CHARGE });
            }
        }
        const before = { E: m, px: 0, py: 0, q: 0 };
        for (const p of photons) { before.E += p.energy; before.px += p.energy * p.vx; before.py += p.energy * p.vy; }
        for (const p of pions) {
            before.E += p.mass * Math.hypot(1, p.wx, p.wy); before.px += p.mass * p.wx; before.py += p.mass * p.wy; before.q += p.charge;
        }
        const variant = async (bh) => {
            const gp = await makeSim({ tree: bh ? 'tree' : 'pairwise', domainW: W, domainH: W, boundary: BOUND_LOOP });
            gp.addParticle({ x: cx, y: cy, mass: m, bornAt: -Infinity });
            addPhotons(gp, photons);
            addPions(gp, pions);
            await run(gp, 8, 0.25);
            await statsNow(gp);   // collects the ledger's escaped radiation
            const [body] = await readParticles(gp);
            // The pools are packed each frame, so their counts bound the live entries
            const nPh = new Uint32Array(await readBuffer(gp, gp.buffers.phCount, 4))[0];
            const nPi = new Uint32Array(await readBuffer(gp, gp.buffers.piCount, 4))[0];
            const ph = new Float32Array(await readBuffer(gp, gp.buffers.photonPool, Math.max(nPh, 1) * 32)), phu = new Uint32Array(ph.buffer);
            const pi = new Float32Array(await readBuffer(gp, gp.buffers.pionPool, Math.max(nPi, 1) * PION_SIZE)), piu = new Uint32Array(pi.buffer);
            const t = { E: gp.ledger.escapedE, px: gp.ledger.escapedPx, py: gp.ledger.escapedPy, q: 0, alive: 0 };
            for (let i = 0; i < nPh; i++) if (phu[i * 8 + 7] & 1) {
                const b = i * 8; t.alive++; t.E += ph[b + 4]; t.px += ph[b + 4] * ph[b + 2]; t.py += ph[b + 4] * ph[b + 3];
            }
            for (let i = 0; i < nPi; i++) if (piu[i * 12 + 9] & 1) {
                const b = i * 12, mm = pi[b + 4];
                t.alive++; t.E += mm * Math.hypot(1, pi[b + 2], pi[b + 3]); t.px += mm * pi[b + 2]; t.py += mm * pi[b + 3]; t.q += pi[b + 5];
            }
            t.E += body.mass * Math.hypot(1, body.wx, body.wy); t.px += body.mass * body.wx; t.py += body.mass * body.wy; t.q += body.charge;
            return { body, t };
        };
        const pair = await variant(false), tree = await variant(true);
        const drift = (v) => Math.max(Math.abs(v.t.E - before.E), Math.abs(v.t.px - before.px), Math.abs(v.t.py - before.py)) / before.E;
        const agree = Math.max(...['mass', 'wx', 'wy', 'charge'].map(k => Math.abs(pair.body[k] - tree.body[k]))) / before.E;
        const worst = Math.max(drift(pair), drift(tree), agree);
        const dq = Math.max(Math.abs(pair.t.q - before.q), Math.abs(tree.t.q - before.q));
        return { expected: `0 left of ${photons.length + pions.length}; E = ${fmt(before.E, 6)}, q = ${fmt(before.q, 2)}`,
                 measured: `${pair.t.alive}, ${tree.t.alive} left; E = ${fmt(pair.t.E, 6)}, ${fmt(tree.t.E, 6)}`,
                 metric: `max rel ${fmt(worst, 2)}, Δq ${fmt(dq, 2)}`,
                 pass: pair.t.alive === 0 && tree.t.alive === 0 && worst < 2e-5 && dq < 1e-5 };
    },
});

// The pools are packed once a frame: dead entries free their slots in order, and a pool full of

    name: 'Boson pools: packed each frame, a full pool recovers, annihilation conserves energy',
    async run() {

        gp.update(1e-3);
        await gp.device.queue.onSubmittedWorkDone();
        const n1 = new Uint32Array(await readBuffer(gp, gp.buffers.phCount, 4))[0];
        const packed = new Float32Array(await readBuffer(gp, gp.buffers.photonPool, 500 * 32));
        let inOrder = true;
        for (let k = 0; k < 500; k++) if (packed[k * 8 + 4] !== 2 * k + 1) inOrder = false;
        gp = await makeSim({ on: ['gravityEnabled', 'bosonInterEnabled'], domainW: 512, domainH: 512 });
        gp.addParticle({ x: 2, y: 2, mass: 0.01 });

        addPions(gp, [{ x: 50, y: 50, wx: 0, wy: 0, mass: 0.15, charge: 0.1 }, { x: 51, y: 50, wx: 0, wy: 0, mass: 0.15, charge: -0.1 }]);
        gp.update(1 / 1024);

        let E = 0;
        for (let i = 0; i < n2; i++) if (phu[i * 8 + 7] & 1) E += ph[i * 8 + 4];
        return { expected: '500 live of 1000, in order; after a full pool culls, 2 photons of E = 0.3',
                 measured: `${n1} live, ${inOrder ? 'in order' : 'out of order'}; ${n2} photons, E = ${fmt(E, 4)}`,
                 metric: '', pass: n1 === 500 && inOrder && n2 === 2 && Math.abs(E - 0.3) < 1e-4 };
    },
});

// ── Expansion ──

cases.push({

// Matter at rest with no forces: ρ ∝ a⁻³ and H² = (8π/3)ρ give Einstein–de Sitter.
cases.push({
    name: 'Friedmann closure: dust alone expands as a ∝ (1 + 3H₀t/2)^{2/3}',
    async run() {

        await run(gp, T, 0.25);

        const hExp = Math.sqrt(8 * Math.PI / 3 * 160 / (64 * 64 * SHEET_THICKNESS));
        return { expected: `H₀ = √(8πρ/3) = ${fmt(hExp)}; a(${T}) = ${fmt(aExp)}`, measured: `H₀ = ${fmt(H0)}; a = ${fmt(a)}`,

// A misaligned axion under a radiation-era schedule: the slab energy a·Σ(½ȧ² + ½m²a²)dA grows
// while the field is frozen and then dilutes; field-ledger.wgsl books Hubble friction and the
// stretch, so E + W does not move.
cases.push({
    name: 'Expansion ledger: a field’s slab energy plus the booked work stays constant',
    async run() {
        const m = 0.1;
        const gp = await makeSim({ on: ['coulombEnabled', 'axionEnabled', 'expansionEnabled'],
                                   params: { hubbleParam: 0.5, cosmoSchedule: 3, axionMass: m, fieldDamping: 0 },
                                   domainW: 64, domainH: 64, boundary: BOUND_LOOP });
        gp.addParticle({ x: 32, y: 32, mass: 0.05, bornAt: -Infinity });
        gp.setField('axion', 1);
        const slab = async () => {
            const f = new Float32Array(await readBuffer(gp, gp._axionBuffers.field, 4));
            const fd = new Float32Array(await readBuffer(gp, gp._axionBuffers.fieldDot, 4));
            return gp.scaleA * gp.domainW * gp.domainH * (0.5 * fd[0] * fd[0] + 0.5 * m * m * f[0] * f[0]);
        };
        const takeWork = async () => {
            const w = new Float32Array(await readBuffer(gp, gp._cosmoAccum, 4))[0];
            gp.device.queue.writeBuffer(gp._cosmoAccum, 0, new Uint32Array(8));
            return w;
        };
        await takeWork();
        const e0 = await slab();
        let W = 0, eMax = e0;
        for (let k = 0; k < 40; k++) {
            await run(gp, 10, 0.5);
            W += await takeWork();
            eMax = Math.max(eMax, await slab());
        }
        const e1 = await slab(), err = (e1 + W - e0) / eMax;
        return { expected: `E + W = E₀ = ${fmt(e0)}`, measured: `E = ${fmt(e1)} (peak ${fmt(eMax)}), W = ${fmt(W)}`,
                 metric: `${fmt(err * 100, 2)}% of the peak`, pass: Math.abs(err) < 0.01 };
    },
});

// ── Scalar fields ──

// Grid gravity: the particles' Φ_P from the FFT convolution against a direct circular
// convolution of the same deposited mass with the sheet kernel −1/√(r² + ℓ²). The bound allows
// Vulkan's sin/cos (absolute error 2⁻¹¹, which software adapters use) in the twiddles; a wrong
// stage parameter is off by order one.
cases.push({
    name: 'Grid gravity: the FFT’s Φ_P equals the direct sheet convolution',
    async run() {
        const gp = await makeSim({ on: ['gravityEnabled', 'higgsEnabled'] });
        gp.addParticle({ x: 20, y: 20, mass: 5 });
        gp.addParticle({ x: 41.3, y: 30.2, mass: 8 });
        gp.addParticle({ x: 50, y: 9.7, mass: 3 });
        await run(gp, 2 * PHYSICS_DT, PHYSICS_DT);
        const N = GPU_SCALAR_GRID, g = gp._gravGrid;
        const mass = new Float32Array(await readBuffer(gp, g.massGrid, N * N * 4));
        const phiP = new Float32Array(await readBuffer(gp, g.phiP, N * N * 4));
        const cw = gp.domainW / N, ch = gp.domainH / N, src = [];
        for (let i = 0; i < N * N; i++) if (mass[i] !== 0) src.push([i % N, Math.floor(i / N), mass[i]]);
        let maxErr = 0, maxPhi = 0;
        for (let iy = 0; iy < N; iy += 3) for (let ix = 0; ix < N; ix += 3) {
            let s = 0;
            for (const [sx, sy, m] of src) {
                let dx = ((ix - sx) % N + N) % N, dy = ((iy - sy) % N + N) % N;
                if (dx > N / 2) dx -= N;
                if (dy > N / 2) dy -= N;
                s -= m / Math.sqrt((dx * cw) ** 2 + (dy * ch) ** 2 + SHEET_THICKNESS_SQ);
            }
            maxErr = Math.max(maxErr, Math.abs(s - phiP[iy * N + ix]));
            maxPhi = Math.max(maxPhi, Math.abs(s));
        }
        const rel = maxErr / maxPhi;
        return { expected: `max |Φ| ${fmt(maxPhi)}`, measured: `max err ${fmt(maxErr, 3)}`,
                 metric: `rel ${fmt(rel, 2)}`, pass: maxPhi > 0.5 && rel < 1e-3 };
    },
});

// ── Lensing ──

/** Build the lens map over a square of side `side` centred on (cx, cy), and wait for the probe. */
async function lensMap(gp, cx, cy, side, distance, star = null, massTotal = undefined) {
    gp.lensHits = null;
    gp.dispatchLens({ left: cx - side / 2, top: cy - side / 2, width: side, height: side, distance, star, massTotal });
    await gp.device.queue.onSubmittedWorkDone();
    while (star && !gp.lensHits) await new Promise(r => setTimeout(r, 2));
    return new Float32Array(await readBuffer(gp, gp.lensBuffers.map, 512 * 512 * 16));
}

// The map is α(x) = Σ 4M𝒟(x − xᵢ)/(|x − xᵢ|² + 10⁻⁴·4M𝒟), summed by the GPU over the compacted
// lens list: against the double-precision sum over 400 slots with dead ones among them, two tiles
// of lenses, and each lens at its image nearest the view's centre.
cases.push({
    name: 'Lensing: the deflection map equals the exact sum over live lenses and their nearest images',
    async run() {
        const W = 64, side = 40, res = 512, D = 0.5, n = 400, rnd = lcg(12345);
        const gp = await makeSim({ domainW: W, domainH: W, boundary: BOUND_LOOP });
        for (let i = 0; i < n; i++) gp.addParticle({ x: rnd() * W, y: rnd() * W, mass: 0.2 + 0.8 * rnd() });
        for (let i = 5; i < n; i += 11) gp.removeParticle(i);
        const map = await lensMap(gp, W / 2, W / 2, side, D);
        const c = W / 2, cell = side / res, wrap = (r) => (r > W / 2 ? r - W : r < -W / 2 ? r + W : r);
        const lenses = (await readParticles(gp)).filter(p => p.alive && p.mass > 0)
            .map(p => ({ x: c + wrap(p.x - c), y: c + wrap(p.y - c), k: 4 * D * p.mass }));
        let worst = 0, top = 0, cells = 0;
        for (let iy = 7; iy < res; iy += 31) for (let ix = 3; ix < res; ix += 29) {
            const tx = c - side / 2 + (ix + 0.5) * cell, ty = c - side / 2 + (iy + 0.5) * cell;
            let ax = 0, ay = 0, near = Infinity;
            for (const l of lenses) {
                const dx = tx - l.x, dy = ty - l.y, rSq = dx * dx + dy * dy, q = l.k / (rSq + 1e-4 * l.k);
                ax += q * dx; ay += q * dy; near = Math.min(near, Math.sqrt(rSq));
            }
            if (near < 0.3) continue;   // on a lens's core f32 rounding of the position shows
            const k = (iy * res + ix) * 4;
            worst = Math.max(worst, Math.hypot(map[k] - ax, map[k + 1] - ay));
            top = Math.max(top, Math.hypot(ax, ay));
            cells++;
        }
        return { expected: `${lenses.length} live lenses of ${n} slots, ${cells} cells`, measured: `worst error ${worst.toExponential(2)}`,
                 metric: `${(worst / top * 100).toFixed(4)}% of max |α|`, pass: worst / top < 1e-5 && cells > 100 };
    },
});

// Inverse ray shooting on the probe's window: a point lens magnifies a uniform disk star by the
// point-lens μ = (u² + 2)/(u√(u² + 4)) averaged over the disk. u = 3 checks the window holds the
// faint inner image.
cases.push({
    name: 'Microlensing: a point lens magnifies a backdrop star by (u² + 2)/(u√(u² + 4))',
    async run() {
        const M = 16, D = 1, thetaE = 8, rs = 1.6, side = 48;
        const muPoint = (u) => (u * u + 2) / (u * Math.sqrt(u * u + 4));
        const muDisk = (u) => {
            let sum = 0, n = 0;
            const N = 200, rho = rs / thetaE;
            for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
                const dx = (2 * (i + 0.5) / N - 1) * rho, dy = (2 * (j + 0.5) / N - 1) * rho;
                if (dx * dx + dy * dy > rho * rho) continue;
                sum += muPoint(Math.hypot(u + dx, dy));
                n++;
            }
            return sum / n;
        };
        const gp = await makeSim({ domainW: 128, domainH: 128 });
        gp.addParticle({ x: 64, y: 64, mass: M });
        const rows = [];
        for (const u of [0.5, 3]) {
            await lensMap(gp, 64, 64, side, D, { x: 64 + u * thetaE, y: 64, r: rs }, M);
            rows.push({ u, mu: gp.lensHits.magnification, exp: muDisk(u) });
        }
        const worst = Math.max(...rows.map(r => Math.abs(r.mu / r.exp - 1)));
        return { expected: rows.map(r => `μ(${r.u}) = ${fmt(r.exp, 4)}`).join(', '), measured: rows.map(r => fmt(r.mu, 4)).join(', '),
                 metric: `worst ${fmt(worst * 100, 2)}%`, pass: worst < 0.01 };
    },
});

// ── Frames and sight ──

// A boost frame cuts world lines on t − u·x = const: lab-static bodies L apart along u sit L/γ
// apart and move at −u, a body at v composes to (v − u)/(1 − uv), and lab-synchronized clocks
// L apart read u·L apart (relativity of simultaneity).
cases.push({
    name: 'Boost frame: rulers contract by 1/γ, velocities compose, lab clocks read u·L apart',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 512, domainH: 512 });
        const L = 60, u = 0.6, g = 1.25, v = 0.5;
        gp.addParticle({ x: 200, y: 256, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 200 + L, y: 256, mass: 1, bornAt: -Infinity });
        gp.addParticle({ x: 230, y: 300, vx: v / Math.sqrt(1 - v * v), mass: 1, bornAt: -Infinity });
        await run(gp, 60, 0.25);
        gp.sliceFrame(frameParams({ boostX: u, originX: 230, originY: 256, refT: gp.simTime }));
        const [a, b, c] = await readView(gp, 3);
        const sep = b.x - a.x, dTau = b.tau - a.tau, vC = (v - u) / (1 - u * v);
        const worst = Math.max(...[sep / (L / g) - 1, a.vx / -u - 1, c.vx / vC - 1, dTau / (u * L) - 1].map(Math.abs));
        return { expected: `Δx′ ${fmt(L / g, 4)}, v′ −0.6 and ${fmt(vC, 4)}, Δτ ${fmt(u * L, 4)}`,
                 measured: `${fmt(sep, 4)}, ${fmt(a.vx, 4)} and ${fmt(c.vx, 4)}, ${fmt(dTau, 4)}`,
                 metric: `${fmt(worst * 100, 2)}%`, pass: a.valid && b.valid && c.valid && worst < 2e-3 };
    },
});

// Rindler: the accelerated observer's instantaneous rest-frame slices all pass one event, its
// corner, at proper distance 1/α behind it.
cases.push({
    name: 'Accelerated observer: every slice passes its corner, 1/α behind it',
    async run() {
        const a = 0.04;
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 2048, domainH: 512 });
        gp.addParticle({ x: 200, y: 256, mass: 1, bornAt: -Infinity });
        const slices = [];
        for (const T of [20, 45]) {
            await run(gp, T - gp.simTime, 0.25);
            gp.sliceFrame(frameParams({ kind: 6, boostX: a, originX: 300, originY: 256, viewHalfW: 1, viewHalfH: 1 }));
            slices.push(await readFrameState(gp));
        }
        const c = slices.map((s) => s.tA - s.ux * s.xA[0]);
        const xP = (c[0] - c[1]) / (slices[1].ux - slices[0].ux), tP = c[1] + slices[1].ux * xP;
        const err = Math.hypot(xP - (300 - 1 / a), tP);   // the corner: x = 300 − 1/α at t = 0
        const s2 = slices[1], proper = Math.sqrt((s2.xA[0] - xP) ** 2 - (s2.tA - tP) ** 2);
        return { expected: `corner (${fmt(300 - 1 / a, 4)}, 0); 1/α = ${fmt(1 / a, 3)} behind`,
                 measured: `(${fmt(xP, 4)}, ${fmt(tP, 3)}); ${fmt(proper, 4)} behind`,
                 metric: `${fmt(err, 2)}`, pass: slices.every((s) => s.valid) && err < 0.05 && Math.abs(proper * a - 1) < 2e-3 };
    },
});

// Seen cuts every world line by the observer's past light cone: a ring of static sources seen by
// an observer at β crowds forward, cos θ′ = (cos θ + β)/(1 + β cos θ), each at the distance its
// light travelled, γR(1 + β cos θ). The streak plate's newest row carries the same directions
// and the Doppler factor D = γ_o(1 − n̂·u)/γ_s(1 − n̂·v), here for a moving source too.
cases.push({
    name: 'Seen and the streak plate: aberration, the light’s distance, and Doppler D',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled'], domainW: 256, domainH: 256 });
        const R = 30, N = 8, beta = 0.6, g = 1 / Math.sqrt(1 - beta * beta);
        const ths = Array.from({ length: N }, (_, k) => (k + 0.5) * 2 * Math.PI / N);
        for (const th of ths) gp.addPrescribed({ kind: 'uniform', t0: 0, x: 128 + R * Math.cos(th), y: 128 + R * Math.sin(th), wx: 0, wy: 0 }, { bornAt: -Infinity });
        const mover = { kind: 'uniform', t0: 0, x: 100, y: 160, wx: 0.5, wy: -0.3 };
        gp.addPrescribed(mover, { bornAt: -Infinity });
        await run(gp, 1, 0.25);
        gp.sliceFrame(frameParams({ kind: 3, boostX: beta, originX: 128, originY: 128, refT: gp.simTime, seen: true, viewHalfW: 1, viewHalfH: 1 }));
        const view = await readView(gp, N);
        gp.requestStreak({ dTau: 0.5, forward: [1, 0] });
        let st = null;
        for (let i = 0; i < 200 && !st; i++) { await new Promise((r) => setTimeout(r, 5)); st = gp.readStreak(); }
        const T = gp.simTime, row0 = (j) => st.data.subarray(j * 4, j * 4 + 4);
        const aberr = (th) => Math.sign(Math.sin(th)) * Math.acos((Math.cos(th) + beta) / (1 + beta * Math.cos(th)));
        let worstA = 0, worstR = 0, worstD = 0;
        ths.forEach((th, k) => {
            worstA = Math.max(worstA, Math.abs(Math.atan2(view[k].y, view[k].x) - aberr(th)), Math.abs(row0(k)[0] - aberr(th)));
            worstR = Math.max(worstR, Math.abs(Math.hypot(view[k].x, view[k].y) / (g * R * (1 + beta * Math.cos(th))) - 1));
            worstD = Math.max(worstD, Math.abs(row0(k)[1] / (g * (1 + beta * Math.cos(th))) - 1));
        });
        let tr = T;   // the moving source, from its analytic retarded event
        for (let i = 0; i < 60; i++) { const p = curveAt(mover, tr); tr = T - Math.hypot(128 - p.x, 128 - p.y); }
        const p = curveAt(mover, tr), gs = Math.sqrt(1 + p.wx ** 2 + p.wy ** 2);
        const r = Math.hypot(128 - p.x, 128 - p.y), n = [(128 - p.x) / r, (128 - p.y) / r];
        const Dm = g * (1 - n[0] * beta) / (gs * (1 - n[0] * p.wx / gs - n[1] * p.wy / gs)), errM = Math.abs(row0(N)[1] / Dm - 1);
        return { expected: `D from ${fmt(g * (1 - beta), 3)} to ${fmt(g * (1 + beta), 3)}; mover D ${fmt(Dm, 4)}`,
                 measured: `${view.filter((b) => b.valid).length} of ${N} seen; mover D ${fmt(row0(N)[1], 4)}`,
                 metric: `|Δθ′| ${fmt(worstA, 2)}, r′ ${fmt(worstR * 100, 2)}%, D ${fmt(worstD * 100, 2)}%, mover ${fmt(errM * 100, 2)}%`,
                 pass: view.every((b) => b.valid) && worstA < 1e-3 && worstR < 1e-3 && worstD < 1e-3 && errM < 1e-3 };
    },
});

// ── Prescribed world lines ──

/** The fastest a cubic Hermite segment between two samples moves (17 points along it). */
function hermiteTopSpeed(a, b) {
    const dt = b.t - a.t, ga = Math.sqrt(1 + a.wx ** 2 + a.wy ** 2), gb = Math.sqrt(1 + b.wx ** 2 + b.wy ** 2);
    let top = 0;
    for (let k = 0; k <= 16; k++) {
        const u = k / 16, d00 = 6 * u * u - 6 * u, d10 = 3 * u * u - 4 * u + 1, d11 = 3 * u * u - 2 * u;
        const vx = d00 * (a.x - b.x) / dt + d10 * a.wx / ga + d11 * b.wx / gb;
        const vy = d00 * (a.y - b.y) / dt + d10 * a.wy / ga + d11 * b.wy / gb;
        top = Math.max(top, Math.hypot(vx, vy));
    }
    return top;
}

// The GPU evaluates the curves again (shared-prescribed.wgsl) and must agree with prescribed.js:
// every kind's samples, accelerations and clock follow its curve under forces it ignores, and the
// interpolant between samples stays timelike.
cases.push({
    name: 'Prescribed world lines: every kind’s samples and clock follow its curve (GPU = prescribed.js)',
    async run() {
        const gp = await makeSim({ on: ['relativityEnabled', 'gravityEnabled', 'coulombEnabled'], domainW: 256, domainH: 256 });
        gp.addParticle({ x: 140, y: 120, mass: 50, charge: 5, bornAt: -Infinity });
        const cx = 128, cy = 128;
        const curves = [
            { kind: 'uniform', t0: 0, x: cx - 20, y: cy, wx: 0.75, wy: 0.4 },
            { kind: 'hyperbola', t0: 6, x: cx, y: cy, nx: 0.6, ny: -0.8, alpha: 0.12 },
            { kind: 'circle', t0: 0, cx, cy, r: 9, omega: -0.1, phase: 1 },
            { kind: 'oscillation', t0: 0, cx, cy, nx: 0, ny: 1, amp: 6, omega: 0.15, phase: 0.3 },
            { kind: 'shuttle', t0: -3, x: cx - 15, y: cy, nx: 1, ny: 0, v: 0.8, alpha: 0.5, coast: 6 },
        ];
        const slots = curves.map((c) => gp.addPrescribed(c, { mass: 1, charge: 1 }));
        await run(gp, 30, 0.25);
        let worstX = 0, worstW = 0, worstA = 0, worstTau = 0, top = 0, n = 0;
        for (const s of slots) {
            const ring = await readRing(gp, s), cu = gp.prescribed.get(s);
            for (let j = 1; j < ring.length; j++) {
                const r = ring[j], c = curveAt(cu, r.t);
                worstX = Math.max(worstX, Math.hypot(r.x - c.x, r.y - c.y));
                worstW = Math.max(worstW, Math.hypot(r.wx - c.wx, r.wy - c.wy));
                // A shuttle's acceleration jumps where a turn begins or ends: a sample on the edge may take either side
                const aErr = (q) => Math.hypot(r.ax - q.ax, r.ay - q.ay);
                worstA = Math.max(worstA, Math.min(aErr(c), aErr(curveAt(cu, r.t - 1e-3)), aErr(curveAt(cu, r.t + 1e-3))));
                worstTau = Math.max(worstTau, Math.abs(r.tau - c.tau));
                top = Math.max(top, hermiteTopSpeed(ring[j - 1], r));
                n++;
            }
        }
        const ck = await readClocks(gp, gp.aliveCount);
        const worstClock = Math.max(...slots.map((s) => Math.abs(ck[s].tau - curveAt(gp.prescribed.get(s), gp.conformalTime).tau)));
        return { expected: 'samples on the curves; |v| < 1 between them', measured: `${n} samples; fastest interpolant ${fmt(top, 4)}`,
                 metric: `|Δx| ${fmt(worstX, 2)}, |Δw| ${fmt(worstW, 2)}, |Δa| ${fmt(worstA, 2)}, |Δτ| ${fmt(worstTau, 2)}, clock ${fmt(worstClock, 2)}`,
                 pass: n >= 500 && worstX < 2e-3 && worstW < 2e-3 && worstA < 2e-3 && worstTau < 2e-3 && worstClock < 2e-3 && top < 1 };
    },
});

// ── Saves ──

// serialize() maps the toggle bits back to TOGGLE_KEYS by hand, and deserialize() writes the
// bodies back with their clocks and curves: a state survives the trip unchanged.
cases.push({
    name: 'Saves round-trip: every toggle and parameter, bodies with their clocks, antimatter and a curve',
    async run() {
        const stub = { collisionMode: 0, boundaryMode: 0, topology: 0, speedScale: 1, camera: { x: 0, y: 0, zoom: 1 } };
        let gp = await makeSim({ on: TOGGLE_KEYS });
        gp.addParticle({ x: 10, y: 10, mass: 1 });
        const toggles = (await gp.serialize(stub)).toggles;
        const missing = TOGGLE_KEYS.filter((k) => toggles[k] !== true);
        gp = await makeSim({ on: ['relativityEnabled', 'gravityEnabled'], params: { yukawaMu: 0.2, extBz: 0.03 }, domainW: 128, domainH: 128 });
        gp.addParticle({ x: 30, y: 40, vx: 0.4, mass: 2, charge: 1, angw: 0.2 });
        gp.addParticle({ x: 90, y: 70, vy: -0.3, mass: 1, antimatter: true });
        gp.addPrescribed({ kind: 'circle', t0: 0, cx: 64, cy: 64, r: 9, omega: 0.1, phase: 0 }, { mass: 1 });
        await run(gp, 5, 0.25);
        const a = await gp.serialize(stub);
        gp.deserialize(a, stub);
        const b = await gp.serialize(stub);
        const same = JSON.stringify(a.particles) === JSON.stringify(b.particles)
            && Object.keys(GPU_PARAMETER_SLOTS).every((k) => a[k] === b[k]) && a.yukawaMu === 0.2;
        const moved = a.particles.every((p) => p.tau > 0);
        return { expected: `${TOGGLE_KEYS.length} toggles; ${a.particles.length} bodies identical after a load`,
                 measured: `missing ${missing.join(', ') || 'none'}; ${same ? 'identical' : 'changed'}`,
                 metric: '', pass: missing.length === 0 && same && moved && a.particles.some((p) => p.antimatter) && a.particles.some((p) => p.curve) };
    },
});

// ── Runner ──

/**
 * Run every case, or those whose name contains `filter`. Resolves to { passed, failed, skipped,
 * results }, where skipped is the reason when there is no WebGPU adapter.
 */
async function runAll(filter = '') {
    rowsEl.textContent = '';
    logEl.textContent = '';
    const out = { passed: 0, failed: 0, skipped: null, results: [] };
    if (!await getDevice()) {
        out.skipped = navigator.gpu ? 'no WebGPU adapter' : 'no navigator.gpu';
        statusEl.textContent = `Skipped: ${out.skipped}.`;
        return (window.__results = out);
    }
    for (const c of cases.filter(c => c.name.includes(filter))) {
        const tr = rowsEl.insertRow();
        for (let i = 0; i < 5; i++) tr.insertCell();
        tr.cells[1].textContent = c.name;
        statusEl.textContent = c.name;
        _gpuErrors = [];
        const t0 = performance.now();
        let r;
        try {
            r = await c.run();
            await _gp.device.queue.onSubmittedWorkDone();
            if (_gpuErrors.length) r = { ...r, pass: false, error: _gpuErrors.join('; ') };
        } catch (e) {
            r = { pass: false, error: String(e.stack || e) };
        }
        const seconds = (performance.now() - t0) / 1000;
        out.results.push({ name: c.name, seconds, ...r });
        r.pass ? out.passed++ : out.failed++;
        tr.className = r.pass ? 'pass' : 'fail';
        tr.cells[0].textContent = r.pass ? 'pass' : (r.error ? 'ERROR' : 'FAIL');
        tr.cells[2].textContent = r.expected ?? '';
        tr.cells[3].textContent = r.measured ?? '';
        tr.cells[4].textContent = r.metric ?? '';
        logln(`${r.pass ? 'pass' : 'FAIL'}  ${c.name}  (${seconds.toFixed(1)} s)${r.error ? '\n      ' + r.error : ''}`);
    }
    statusEl.textContent = out.failed ? `${out.failed} of ${out.results.length} failed.` : `All ${out.results.length} passed.`;
    return (window.__results = out);
}

document.getElementById('runBtn').addEventListener('click', () => runAll());
window.__run = window.runAll = runAll;
window.__ready = true;
</script>
